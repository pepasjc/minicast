<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>minicast SH4 RAM heat</title>
<style>
  :root { --bg:#101014; --panel:#1b1b21; --fg:#d8d8dc; --dim:#8a8a92; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.4 "Segoe UI", system-ui, sans-serif; }
  #drop-wrap { display:flex; justify-content:center; align-items:center; height:100vh; }
  #drop-area { width:70vw; height:45vh; border:3px dashed #555; border-radius:14px;
               display:flex; flex-direction:column; gap:12px; justify-content:center;
               align-items:center; color:var(--dim); font-size:1.1rem; text-align:center; }
  #drop-area.highlight { border-color:#e04a2a; color:var(--fg); }
  #drop-area code { color:#c8c8d0; font-size:.85rem; }
  #progress { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7);
              z-index:50; justify-content:center; align-items:center; flex-direction:column; gap:10px; }
  #progress .bar { width:40vw; height:10px; background:#333; border-radius:5px; overflow:hidden; }
  #progress .bar div { height:100%; width:0%; background:#e04a2a; }
  #app { display:none; padding:8px 10px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #topbar { margin-bottom:6px; }
  #topbar b { color:#fff; }
  canvas { display:block; }
  #heat { width:100%; background:var(--panel); border-radius:4px; cursor:crosshair; }
  button, select { background:#2c2c34; color:var(--fg); border:1px solid #4a4a52;
                   border-radius:3px; padding:2px 10px; cursor:pointer; }
  button:hover { background:#3a3a44; }
  #tooltip { display:none; position:fixed; background:#000d; color:#fff; padding:4px 8px;
             border-radius:3px; font-family:Consolas,monospace; font-size:12px;
             pointer-events:none; z-index:60; white-space:pre; }
  .hint { color:var(--dim); font-size:12px; }
  .scale { display:inline-flex; align-items:center; gap:6px; }
  .scale i { display:inline-block; width:130px; height:11px; border-radius:2px;
             background:linear-gradient(90deg,#000,#800000,#f00,#ff8000,#fff); }
</style>
</head>
<body>

<div id="drop-wrap">
  <div id="drop-area">
    <div>Drop a <b>perfheat</b> trace here</div>
    <div>or</div>
    <input type="file" id="file-input" accept=".txt,.heat,text/plain"/>
    <div class="hint">
      <code>perf script -i perf.data -F time,ip &gt; samples.txt</code><br/>
      <code>tools/perfheat.py samples.txt jit.map minicast.elf &gt; heat.txt</code>
    </div>
  </div>
</div>

<div id="progress"><div>parsing…</div><div class="bar"><div id="pbar"></div></div></div>

<div id="app">
  <div class="row" id="topbar">
    <b id="fname"></b>
    <span id="stats" class="hint"></span>
    <span class="scale">cold <i></i> hot</span>
    <span class="hint" id="peak"></span>
    <button id="reset">reset view</button>
    <span class="hint">wheel: zoom time &nbsp; shift+wheel: zoom address &nbsp; drag: pan &nbsp; dbl-click: reset</span>
  </div>
  <canvas id="heat"></canvas>
</div>
<div id="tooltip"></div>

<script>
'use strict';
// ============================== data model ==============================
// Samples are (time, block, weight). A block covers a RANGE of SH4 addresses
// (its sh4_code_size), and the cost is spread across that whole range - see
// perfheat.py for why the entry pc alone is the wrong place to put it.
const DB = {
  meta: {},
  bAddr: null, bSize: null, nB: 0,     // block table
  t: null, bi: null, w: null, nS: 0,   // samples, ascending in time
  tSpan: 1, mask: 0x01FFFFFF,
  aMin: 0, aMax: 1,                    // address extent of the sampled blocks
  totalW: 0,
};
// A row's offset is folded, so labelling it needs the SH4 region the code
// actually ran in - P1 cached RAM (0x8C......) in practice, but perfheat.py
// measures it per capture and sends it as M label_base rather than guessing.
// Aliases of one physical address (0x8C.. / 0xAC..) share a row on purpose.
let LABEL_BASE = 0x8C000000;

function parse(text, done, progress) {
  if (!text.startsWith('MINICASTHEAT')) { alert('not a MINICASTHEAT file'); return; }
  const meta = {};
  const bAddr = [], bSize = [];
  let cap = 1 << 16;
  let t = new Float64Array(cap), bi = new Int32Array(cap), w = new Float64Array(cap), n = 0;
  let pos = 0, tAcc = 0;
  const len = text.length;

  function grow() {
    const t2 = new Float64Array(cap * 2); t2.set(t); t = t2;
    const b2 = new Int32Array(cap * 2); b2.set(bi); bi = b2;
    const w2 = new Float64Array(cap * 2); w2.set(w); w = w2;
    cap *= 2;
  }
  function step() {
    const end = Math.min(pos + 4_000_000, len);
    while (pos < len) {
      let nl = text.indexOf('\n', pos);
      if (nl === -1) nl = len;
      const line = text.substring(pos, nl);
      pos = nl + 1;
      const c = line.charCodeAt(0);
      if (c === 83) {                                  // 'S <dt> <block> <weight>'
        const p = line.split(' ');
        tAcc += +p[1];
        if (n === cap) grow();
        t[n] = tAcc; bi[n] = +p[2]; w[n] = +p[3] || 1; n++;
      } else if (c === 66) {                           // 'B <idx> <addr> <size>'
        const p = line.split(' ');
        const i = +p[1];
        bAddr[i] = parseInt(p[2], 16);
        bSize[i] = Math.max(1, parseInt(p[3], 16));
      } else if (c === 77) {                           // 'M <key> <value>'
        const p = line.split(' ');
        meta[p[1]] = p.slice(2).join(' ');
      }
      if (pos >= end) break;
    }
    progress(pos / len);
    if (pos < len) { setTimeout(step, 0); return; }
    DB.meta = meta;
    DB.bAddr = Int32Array.from(bAddr.map(v => v | 0));
    DB.bSize = Int32Array.from(bSize.map(v => v | 0));
    DB.nB = bAddr.length;
    DB.t = t; DB.bi = bi; DB.w = w; DB.nS = n;
    DB.mask = meta.mask ? parseInt(meta.mask, 16) : 0x01FFFFFF;
    if (meta.label_base) LABEL_BASE = parseInt(meta.label_base, 16) >>> 0;
    DB.tSpan = n ? (t[n - 1] - t[0]) || 1 : 1;
    let tot = 0;
    for (let i = 0; i < n; i++) tot += w[i];
    DB.totalW = tot;
    // Address extent of the DATA, not of the 32 MB window. Guest code occupies a
    // few narrow bands (RAM, BIOS aliases), so spanning the whole fold would spend
    // nearly all the vertical pixels on empty space. Every block in the table is
    // referenced by at least one sample - perfheat.py only emits a block when a
    // sample lands in it - so the table's extent IS the samples' extent, and the
    // END of a block counts, not just its start.
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < DB.nB; i++) {
      if (DB.bAddr[i] < lo) lo = DB.bAddr[i];
      const e = DB.bAddr[i] + DB.bSize[i];
      if (e > hi) hi = e;
    }
    if (!(lo < hi)) { lo = 0; hi = DB.mask + 1; }
    DB.aMin = lo; DB.aMax = hi;
    done();
  }
  setTimeout(step, 0);
}

// ============================== view / render ==============================
const GUTTER = 92, AXIS_H = 20;
const cv = document.getElementById('heat');
let view = { t0: 0, t1: 1, a0: 0, a1: 1 };
let grid = null, gridW = 0, gridH = 0, gridMax = 0;

// first sample index with t >= x
function lowerBound(x) {
  let lo = 0, hi = DB.nS;
  while (lo < hi) { const m = (lo + hi) >> 1; if (DB.t[m] < x) lo = m + 1; else hi = m; }
  return lo;
}

// Accumulate weights into a W x H grid over the current view.
//
// Each sample's weight is spread UNIFORMLY over the address rows its block
// covers, so a block is as tall as the guest code it was compiled from and the
// total charged is the sample's weight regardless of how many rows that is.
// (Dumping the whole weight on every covered row instead would make big blocks
// glow simply for being big.)
function bin(W, H) {
  const g = new Float64Array(W * H);
  const { t0, t1, a0, a1 } = view;
  const tSpan = t1 - t0, aSpan = a1 - a0;
  const i1 = lowerBound(t1);
  let max = 0;
  for (let i = lowerBound(t0); i < i1; i++) {
    const x = Math.floor((DB.t[i] - t0) / tSpan * W);
    if (x < 0 || x >= W) continue;
    const b = DB.bi[i];
    const lo = DB.bAddr[b], hi = lo + DB.bSize[b];
    // clip the block's guest span to the visible address window
    const cl = Math.max(lo, a0), ch = Math.min(hi, a1);
    if (ch <= cl) continue;
    const wt = DB.w[i] / (hi - lo);            // weight per guest byte
    let y0 = Math.floor((cl - a0) / aSpan * H);
    let y1 = Math.ceil((ch - a0) / aSpan * H);
    if (y0 < 0) y0 = 0; if (y1 > H) y1 = H;
    if (y1 <= y0) y1 = y0 + 1;
    const bytesPerRow = aSpan / H;
    for (let y = y0; y < y1; y++) {
      // bytes of THIS block landing in row y
      const r0 = a0 + y * bytesPerRow, r1 = r0 + bytesPerRow;
      const ov = Math.min(ch, r1) - Math.max(cl, r0);
      if (ov <= 0) continue;
      const k = y * W + x;
      const v = (g[k] += wt * ov);
      if (v > max) max = v;
    }
  }
  grid = g; gridW = W; gridH = H; gridMax = max;
}

// black -> deep red -> red -> orange -> white. 0 stays pure black so untouched
// RAM reads as empty, and the bulk of the range is red as asked.
function heat(v) {
  if (v <= 0) return [0, 0, 0];
  const r = Math.min(1, v * 3), g = Math.min(1, Math.max(0, v * 3 - 1)),
        b = Math.min(1, Math.max(0, v * 3 - 2));
  return [(r * 255) | 0, (g * 255) | 0, (b * 255) | 0];
}

function draw() {
  const cssW = cv.clientWidth || cv.parentElement.clientWidth;
  const H = Math.max(320, Math.min(760, window.innerHeight - 120));
  const dpr = window.devicePixelRatio || 1;
  cv.width = cssW * dpr; cv.height = H * dpr;
  cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#1b1b21'; ctx.fillRect(0, 0, cssW, H);

  const W = Math.max(1, Math.floor(cssW - GUTTER));
  const GH = Math.max(1, H - AXIS_H);
  bin(W, GH);

  // Paint the grid. The colour range is LINEAR and normalised to the hottest cell
  // in the current bounding box - bin() only accumulates what is on screen, so
  // gridMax is the visible peak, not the run's. Zooming into a cold region
  // therefore re-spreads the full black..white ramp across that region's own
  // range instead of leaving it uniformly black under some global hotspot.
  const img = ctx.createImageData(W, GH);
  const d = img.data;
  const denom = gridMax || 1;
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < W; x++) {
      const v = grid[y * W + x];
      const c = heat(v <= 0 ? 0 : v / denom);
      const o = (y * W + x) * 4;
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
  }
  ctx.putImageData(img, GUTTER, 0);
  // the scale is relative, so the peak it is pinned to has to be legible
  document.getElementById('peak').textContent =
    'peak in view ' + (gridMax ? gridMax.toFixed(2) : '0') +
    (DB.totalW ? ` (${(gridMax / DB.totalW * 100).toFixed(2)}% of run)` : '');

  // ---- address axis (y): hex, plus the canonical 0x0C....... form ----
  ctx.font = '11px Consolas, monospace';
  const aSpan = view.a1 - view.a0;
  const aStep = niceStep(aSpan / (GH / 46));
  ctx.textBaseline = 'middle';
  for (let a = Math.ceil(view.a0 / aStep) * aStep; a < view.a1; a += aStep) {
    const y = (a - view.a0) / aSpan * GH;
    ctx.fillStyle = '#33333c'; ctx.fillRect(GUTTER, y, W, 1);
    ctx.fillStyle = '#9a9aa2';
    ctx.fillText('0x' + ((LABEL_BASE | a) >>> 0).toString(16).toUpperCase().padStart(8, '0'), 4, y);
  }
  // ---- time axis (x) ----
  ctx.fillStyle = '#24242a'; ctx.fillRect(GUTTER, GH, W, AXIS_H);
  const tSpan = view.t1 - view.t0;
  const tStep = niceStep(tSpan / 7);
  ctx.textBaseline = 'alphabetic';
  for (let t = Math.ceil(view.t0 / tStep) * tStep; t < view.t1; t += tStep) {
    const x = GUTTER + (t - view.t0) / tSpan * W;
    ctx.fillStyle = '#3a3a42'; ctx.fillRect(x, 0, 1, GH);
    ctx.fillStyle = '#9a9aa2'; ctx.fillText(fmtTime(t), x + 3, GH + 14);
  }
  ctx.fillStyle = '#6a6a72';
  ctx.fillText('SH4 addr', 4, GH + 14);
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9))));
  const n = raw / p;
  return (n > 5 ? 10 : n > 2 ? 5 : n > 1 ? 2 : 1) * p;
}
function fmtTime(ns) {
  if (Math.abs(ns) >= 1e9) return (ns / 1e9).toFixed(2) + 's';
  if (Math.abs(ns) >= 1e6) return (ns / 1e6).toFixed(1) + 'ms';
  if (Math.abs(ns) >= 1e3) return (ns / 1e3).toFixed(1) + 'µs';
  return ns.toFixed(0) + 'ns';
}

function resetView() {
  view.t0 = DB.nS ? DB.t[0] : 0;
  view.t1 = DB.nS ? DB.t[DB.nS - 1] + 1 : 1;
  // the axis covers the sampled address range, not the whole 32 MB fold
  view.a0 = DB.aMin; view.a1 = DB.aMax;
  draw();
}
function clampView() {
  if (view.t1 - view.t0 < 1000) view.t1 = view.t0 + 1000;      // 1us floor
  if (view.a1 - view.a0 < 16) view.a1 = view.a0 + 16;          // 16 byte floor
  // pan/zoom stays inside the sampled band for the same reason reset does
  const lo = DB.aMin, hi = Math.max(DB.aMax, lo + 16);
  if (view.a1 - view.a0 > hi - lo) { view.a0 = lo; view.a1 = hi; return; }
  if (view.a0 < lo) { view.a1 += lo - view.a0; view.a0 = lo; }
  if (view.a1 > hi) { view.a0 -= view.a1 - hi; view.a1 = hi; }
}

// ============================== interaction ==============================
function atEvent(ev) {
  const r = cv.getBoundingClientRect();
  const W = r.width - GUTTER, GH = r.height - AXIS_H;
  const fx = Math.max(0, Math.min(1, (ev.clientX - r.left - GUTTER) / W));
  const fy = Math.max(0, Math.min(1, (ev.clientY - r.top) / GH));
  return { t: view.t0 + fx * (view.t1 - view.t0),
           a: view.a0 + fy * (view.a1 - view.a0), fx, fy, W, GH, r };
}
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const p = atEvent(ev);
  const f = ev.deltaY > 0 ? 1.3 : 1 / 1.3;
  if (ev.shiftKey) {
    view.a0 = p.a - (p.a - view.a0) * f;
    view.a1 = p.a + (view.a1 - p.a) * f;
  } else {
    view.t0 = p.t - (p.t - view.t0) * f;
    view.t1 = p.t + (view.t1 - p.t) * f;
  }
  clampView(); draw();
}, { passive: false });

let drag = null;
cv.addEventListener('mousedown', ev => {
  drag = { x: ev.clientX, y: ev.clientY, v: { ...view } };
});
window.addEventListener('mousemove', ev => {
  if (drag) {
    const r = cv.getBoundingClientRect();
    const dt = (ev.clientX - drag.x) / (r.width - GUTTER) * (drag.v.t1 - drag.v.t0);
    const da = (ev.clientY - drag.y) / (r.height - AXIS_H) * (drag.v.a1 - drag.v.a0);
    view.t0 = drag.v.t0 - dt; view.t1 = drag.v.t1 - dt;
    view.a0 = drag.v.a0 - da; view.a1 = drag.v.a1 - da;
    clampView(); draw();
    return;
  }
  if (ev.target !== cv) { document.getElementById('tooltip').style.display = 'none'; return; }
  const p = atEvent(ev);
  const tt = document.getElementById('tooltip');
  const x = Math.floor(p.fx * gridW), y = Math.floor(p.fy * gridH);
  const v = (grid && x >= 0 && x < gridW && y >= 0 && y < gridH) ? grid[y * gridW + x] : 0;
  const bytesPerRow = (view.a1 - view.a0) / gridH;
  const rowA = view.a0 + y * bytesPerRow;
  tt.textContent =
    `t ${fmtTime(p.t)}\n` +
    `addr 0x${((LABEL_BASE | rowA) >>> 0).toString(16).toUpperCase().padStart(8, '0')}` +
    (bytesPerRow > 1 ? ` .. +${Math.round(bytesPerRow)}B` : '') + '\n' +
    `cost ${v.toFixed(2)}` +
    (DB.totalW ? `  (${(v / DB.totalW * 100).toFixed(2)}% of run)` : '');
  tt.style.display = 'block';
  tt.style.left = (ev.clientX + 14) + 'px';
  tt.style.top = (ev.clientY + 12) + 'px';
});
window.addEventListener('mouseup', () => drag = null);
cv.addEventListener('mouseleave', () => document.getElementById('tooltip').style.display = 'none');
cv.addEventListener('dblclick', resetView);
document.getElementById('reset').addEventListener('click', resetView);
window.addEventListener('resize', () => { if (DB.nS) draw(); });

// ============================== loading ==============================
function loadText(name, text) {
  const prog = document.getElementById('progress');
  prog.style.display = 'flex';
  parse(text, () => {
    prog.style.display = 'none';
    document.getElementById('drop-wrap').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('fname').textContent = name;
    const m = DB.meta;
    document.getElementById('stats').textContent =
      `${DB.nS.toLocaleString()} jit samples / ${(+m.samples || DB.nS).toLocaleString()} total` +
      `  ·  ${DB.nB.toLocaleString()} blocks  ·  ${fmtTime(DB.tSpan)}`;
    resetView();
  }, f => document.getElementById('pbar').style.width = (f * 100).toFixed(1) + '%');
}
function loadFile(file) {
  const rd = new FileReader();
  rd.onload = ev => loadText(file.name, ev.target.result);
  rd.readAsText(file);
}
const dropArea = document.getElementById('drop-area');
['dragenter','dragover','dragleave','drop'].forEach(n => {
  document.body.addEventListener(n, e => e.preventDefault());
  dropArea.addEventListener(n, e => e.preventDefault());
});
['dragenter','dragover'].forEach(n =>
  dropArea.addEventListener(n, () => dropArea.classList.add('highlight')));
['dragleave','drop'].forEach(n =>
  dropArea.addEventListener(n, () => dropArea.classList.remove('highlight')));
document.body.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files.length) loadFile(e.target.files[0]);
});
{
  const f = new URLSearchParams(location.search).get('file');
  if (f) {
    document.getElementById('progress').style.display = 'flex';
    fetch(f).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text => loadText(f, text))
      .catch(err => {
        document.getElementById('progress').style.display = 'none';
        alert(`failed to fetch "${f}": ${err.message}` +
              (location.protocol === 'file:' ? '\n(file:// cannot fetch - serve the dir over http)' : ''));
      });
  }
}
</script>
</body>
</html>
